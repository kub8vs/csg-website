<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSG · Strona w budowie</title>
<meta name="description" content="CSG – Centrum Serwisowe. Strona w budowie. Kontakt telefoniczny i mailowy.">
<link rel="icon" type="image/svg+xml" href="csg-logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#22A553; --teal:#28706C; --purple:#433A72; --ink:#1F2933; --muted:#6B7480;
    --grad:linear-gradient(90deg,var(--green),var(--teal) 50%,var(--purple));
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:#fff;color:var(--ink);font-family:Sora,system-ui,sans-serif;
    min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:48px 20px;-webkit-font-smoothing:antialiased}
  main{display:flex;flex-direction:column;align-items:center;text-align:center;width:100%;max-width:520px}
  .logo{width:min(400px,78vw);height:auto;display:block;animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
  .soon{margin-top:44px;font-weight:300;font-size:clamp(13px,3.4vw,15px);letter-spacing:.48em;padding-left:.48em;
    text-transform:uppercase;color:var(--purple);animation:rise .9s .15s cubic-bezier(.2,.7,.2,1) both}
  .line{margin-top:22px;width:180px;max-width:60vw;height:3px;background:var(--grad);transform:skewX(-30deg);
    animation:grow .8s .35s cubic-bezier(.2,.7,.2,1) both}
  .contact{margin-top:30px;display:flex;flex-direction:column;gap:14px;animation:rise .9s .45s cubic-bezier(.2,.7,.2,1) both}
  .contact a{display:inline-flex;align-items:center;justify-content:center;gap:12px;color:var(--ink);text-decoration:none;
    font-weight:600;font-size:clamp(16px,4.4vw,19px);letter-spacing:.01em;padding:6px 4px;border-radius:999px;transition:color .2s}
  .contact a:hover{color:var(--teal)}
  .contact svg{width:20px;height:20px;flex:none;stroke:var(--teal);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @keyframes grow{from{opacity:0;width:0}to{opacity:1;width:180px}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
  <img class="logo" src="csg-logo.svg" width="1243" height="720" alt="CSG">
  <p class="soon">Strona w budowie</p>
  <div class="line" aria-hidden="true"></div>
  <div class="contact">
    <a href="tel:+48600057520"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>+48 600-057-520</a>
    <a href="mailto:biuro@csgcentrum.pl"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>biuro@csgcentrum.pl</a>
  </div>
</main>
</body>
</html>
